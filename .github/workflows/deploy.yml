name: Deploy Resume

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-3

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Tofu Init
        working-directory: terraform
        run: tofu init

      - name: Tofu Apply
        working-directory: terraform
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
        run: tofu apply -auto-approve

      - name: Sync website to S3
        run: |
          API_URL=$(cd terraform && tofu output -raw api_gateway_url)
          sed -i "s|__API_URL__|$API_URL|g" website/index.html
          BUCKET=$(cd terraform && tofu output -raw s3_bucket_name)
          aws s3 sync website/ s3://$BUCKET/ --delete

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(cd terraform && tofu output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation \
            --distribution-id $DIST_ID \
            --invalidation-batch "{\"Paths\":{\"Quantity\":1,\"Items\":[\"/*\"]},\"CallerReference\":\"github-actions-${{ github.run_id }}\"}"
