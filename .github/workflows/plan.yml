name: Plan infrastructure

on:
  pull_request:
    # Only run when infra, workflows or website files change
    paths:
      - 'terraform/**'
      - 'website/**'
      - '.github/workflows/**'

# Cancel in-progress runs on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs independently of AWS — no credentials needed
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write # required to publish test results

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      # Restore cached venv if requirements.txt hasn't changed
      - name: Cache pip dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 #v5.0.4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Run tests
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          cd website && ../.venv/bin/python -m pytest tests/ -v --junitxml=../pytest-report.xml

      # Publish test results as a check on the PR, even if tests fail
      - name: Test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 #v3.0.0
        if: always()
        with:
          name: pytest
          path: pytest-report.xml
          reporter: java-junit

  # Plans against staging — the first stop on the trunk-based deployment pipeline
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false # access staging secrets without creating a deployment record

    permissions:
      id-token: write    # required for OIDC authentication with AWS
      contents: read
      pull-requests: write # required to post the plan comment on the PR

    defaults:
      run:
        working-directory: terraform/envs/staging

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      # Authenticate via OIDC — no long-lived credentials stored in secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb #v2.0.0

      - name: Compute Lambda package key
        id: build
        run: |
          HASH=$(sha256sum ../../website/counter.py | cut -d' ' -f1)
          echo "s3_key=lambda/$HASH/counter.zip" >> $GITHUB_OUTPUT

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 #v6.2.2

      - name: Run TFLint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/terraform/modules/app/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/terraform/modules/app/.tflint.hcl"

      # Scan Terraform files for security issues, upload results to GitHub Security tab
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@0ce65fae06c148e349f955c3c35ad049c11e838c #v12.3092.0
        with:
          directory: ./terraform/envs/staging/
          framework: terraform
          quiet: true
          soft_fail: true
          output_format: sarif
          output_file_path: checkov.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 #v4.35.1
        if: always()
        with:
          sarif_file: checkov.sarif

      - name: Tofu Init
        run: tofu init

      - name: Tofu Plan
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_lambda_s3_key: ${{ steps.build.outputs.s3_key }}
          TF_VAR_basic_auth_credentials: ${{ secrets.BASIC_AUTH_CREDENTIALS }}
        run: tofu plan -out=tfplan

      # Posts the plan diff as a comment on the PR for review
      - name: Post plan comment
        uses: borchero/terraform-plan-comment@d177dfb833ccfb6ef6022700796190dfe54830f1 #v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          terraform-cmd: tofu
          working-directory: terraform/envs/staging
          planfile: tfplan

      - name: Setup Infracost
        uses: infracost/actions/setup@d51fc54d23c9ad90f984b884257bd96dc2625067 #v4.1.0
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost estimate
        run: |
          tofu show -json tfplan > /tmp/plan.json
          infracost breakdown \
            --path /tmp/plan.json \
            --format json \
            --out-file /tmp/infracost.json

      - name: Post Infracost comment
        run: |
          infracost comment github \
            --path /tmp/infracost.json \
            --repo ${{ github.repository }} \
            --pull-request ${{ github.event.pull_request.number }} \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --behavior update
