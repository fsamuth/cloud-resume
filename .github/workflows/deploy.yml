name: Deploy Resume

on:
  push:
    branches: [main]
    # Only run when infra, workflows or website files change
    paths:
      - 'terraform/**'
      - 'website/**'
      - '.github/workflows/**'
  workflow_dispatch: # allow manual trigger

# Cancel in-progress runs on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      id-token: write # required for OIDC authentication with AWS
      contents: read

    outputs:
      lambda_s3_key: ${{ steps.build.outputs.s3_key }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and upload Lambda package
        id: build
        run: |
          cd website
          zip /tmp/counter.zip counter.py
          HASH=$(sha256sum counter.py | cut -d' ' -f1)
          echo "s3_key=lambda/$HASH/counter.zip" >> $GITHUB_OUTPUT
          aws s3 ls s3://${{ vars.PROJECT_NAME }}-artifacts/lambda/$HASH/counter.zip || \
            aws s3 cp /tmp/counter.zip s3://${{ vars.PROJECT_NAME }}-artifacts/lambda/$HASH/counter.zip

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write # required for OIDC authentication with AWS
      contents: read

    outputs:
      website: ${{ steps.flags.outputs.website }}
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      # Detect whether website files changed to conditionally sync S3 and invalidate cache
      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d #v4.0.1
        with:
          filters: |
            website:
              - 'website/public/**'

      # On workflow_dispatch, force all steps to run regardless of changed files
      - name: Set run flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "website=true" >> $GITHUB_OUTPUT
          else
            echo "website=${{ steps.changes.outputs.website }}" >> $GITHUB_OUTPUT
          fi

      # Authenticate via OIDC — no long-lived credentials stored in secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb #v2.0.0

      - name: Tofu Init
        working-directory: terraform/app
        run: tofu init

      - name: Tofu Plan
        id: plan
        working-directory: terraform/app
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_lambda_s3_key: ${{ needs.build.outputs.lambda_s3_key }}
        run: |
          set +e
          tofu plan -detailed-exitcode -out=tfplan
          EXIT_CODE=$?
          set -e

          # Exit 1 = error, fail immediately
          if [ $EXIT_CODE -eq 1 ]; then exit 1; fi

          # Exit 0 = no changes, exit 2 = changes
          echo "has_changes=$([ $EXIT_CODE -eq 2 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Upload plan
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: tfplan
          path: terraform/app/tfplan
          retention-days: 1

  apply:
    name: Apply
    needs: [build, plan]
    runs-on: ubuntu-latest
    environment: production # requires manual approval
    if: needs.plan.outputs.has_changes == 'true'

    permissions:
      id-token: write # required for OIDC authentication with AWS
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      # Authenticate via OIDC — no long-lived credentials stored in secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb #v2.0.0

      - name: Tofu Init
        working-directory: terraform/app
        run: tofu init

      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: tfplan
          path: terraform/app/

      - name: Tofu Apply
        working-directory: terraform/app
        run: tofu apply -auto-approve tfplan

  sync:
    name: Sync website
    needs: [plan, apply]
    runs-on: ubuntu-latest
    # Run if website changed AND apply didn't fail (covers both apply succeeded or was skipped)
    if: |
      always() &&
      needs.plan.outputs.website == 'true' &&
      needs.apply.result != 'failure'

    permissions:
      id-token: write # required for OIDC authentication with AWS
      contents: read
      issues: write   # required for ZAP to open scan report issues

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      # Authenticate via OIDC — no long-lived credentials stored in secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb #v2.0.0

      - name: Tofu Init
        working-directory: terraform/app
        run: tofu init

      - name: Sync website to S3
        run: |
          API_URL=$(cd terraform/app && tofu output -raw api_gateway_url | sed 's|/$||')
          sed -i "s|__API_URL__|$API_URL|g" website/public/counter.js
          BUCKET=$(cd terraform/app && tofu output -raw s3_bucket_name)
          aws s3 sync website/public/ s3://$BUCKET/ --delete

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(cd terraform/app && tofu output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation \
            --distribution-id $DIST_ID \
            --invalidation-batch "{\"Paths\":{\"Quantity\":1,\"Items\":[\"/*\"]},\"CallerReference\":\"github-actions-${{ github.run_id }}\"}"

      # Passive security scan — only runs when website content changed
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 #v0.15.0
        with:
          target: "https://${{ vars.DOMAIN_NAME }}"
          fail_action: false
          issue_title: "ZAP Baseline Scan Report"
