name: Deploy Resume

on:
  push:
    branches: [main]
    # Only run when infra, workflows or website files change
    paths:
      - 'terraform/**'
      - 'website/**'
      - '.github/workflows/**'
  workflow_dispatch: # allow manual trigger

# Cancel in-progress runs on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      id-token: write # required for OIDC authentication with AWS
      contents: read

    outputs:
      lambda_s3_key: ${{ steps.build.outputs.s3_key }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and upload Lambda package
        id: build
        run: |
          cd website
          zip /tmp/counter.zip counter.py
          HASH=$(sha256sum counter.py | cut -d' ' -f1)
          echo "s3_key=lambda/$HASH/counter.zip" >> $GITHUB_OUTPUT
          aws s3 ls s3://fsamuth-resume-artifacts/lambda/$HASH/counter.zip || \
            aws s3 cp /tmp/counter.zip s3://fsamuth-resume-artifacts/lambda/$HASH/counter.zip

  # ── Staging ────────────────────────────────────────────────────────────────

  plan-staging:
    name: Plan (staging)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      deployment: false # access env vars/secrets without creating a deployment record

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: terraform/envs/staging

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d #v4.0.1
        with:
          filters: |
            website:
              - 'website/public/**'

      - name: Set run flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "website=true" >> $GITHUB_OUTPUT
          else
            echo "website=${{ steps.changes.outputs.website }}" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb #v2.0.0

      - name: Tofu Init
        run: tofu init

      - name: Tofu Plan
        id: plan
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_lambda_s3_key: ${{ needs.build.outputs.lambda_s3_key }}
        run: |
          set +e
          tofu plan -detailed-exitcode -out=tfplan
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 1 ]; then exit 1; fi
          echo "has_changes=$([ $EXIT_CODE -eq 2 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Upload plan
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: tfplan-staging
          path: terraform/envs/staging/tfplan
          retention-days: 1

  apply-staging:
    name: Apply (staging)
    runs-on: ubuntu-latest
    needs: [build, plan-staging]
    environment: staging

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: terraform/envs/staging

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb #v2.0.0

      - name: Tofu Init
        run: tofu init

      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: tfplan-staging
          path: terraform/envs/staging/

      - name: Tofu Apply
        run: tofu apply -auto-approve tfplan

  sync-staging:
    name: Sync website (staging)
    runs-on: ubuntu-latest
    needs: [apply-staging]
    environment: staging
    if: needs.apply-staging.result == 'success'

    permissions:
      id-token: write
      contents: read
      issues: write # required for ZAP to open scan report issues

    defaults:
      run:
        working-directory: terraform/envs/staging

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      # Detect website changes independently — avoids relying on plan-staging outputs
      # which don't propagate from environment-scoped jobs
      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d #v4.0.1
        with:
          filters: |
            website:
              - 'website/public/**'

      - name: Set sync flag
        id: flags
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "website=true" >> $GITHUB_OUTPUT
          else
            echo "website=${{ steps.changes.outputs.website }}" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.flags.outputs.website == 'true'
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup OpenTofu
        if: steps.flags.outputs.website == 'true'
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb #v2.0.0

      - name: Tofu Init
        if: steps.flags.outputs.website == 'true'
        run: tofu init

      - name: Sync website to S3
        if: steps.flags.outputs.website == 'true'
        run: |
          API_URL=$(tofu output -raw api_gateway_url | sed 's|/$||')
          sed -i "s|__API_URL__|$API_URL|g" ${{ github.workspace }}/website/public/counter.js
          BUCKET=$(tofu output -raw s3_bucket_name)
          aws s3 sync ${{ github.workspace }}/website/public/ s3://$BUCKET/ --delete \
            --exclude "*.html" --cache-control "max-age=31536000,immutable"
          aws s3 sync ${{ github.workspace }}/website/public/ s3://$BUCKET/ --delete \
            --exclude "*" --include "*.html" --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        if: steps.flags.outputs.website == 'true'
        run: |
          DIST_ID=$(tofu output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation \
            --distribution-id $DIST_ID \
            --invalidation-batch "{\"Paths\":{\"Quantity\":1,\"Items\":[\"/*\"]},\"CallerReference\":\"github-actions-${{ github.run_id }}\"}"

      - name: ZAP Baseline Scan
        if: steps.flags.outputs.website == 'true'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 #v0.15.0
        with:
          target: "https://${{ vars.DOMAIN_NAME }}"
          fail_action: false
          issue_title: "ZAP Baseline Scan Report (staging)"

  # ── Production ─────────────────────────────────────────────────────────────

  plan-production:
    name: Plan (production)
    runs-on: ubuntu-latest
    # Wait for all staging jobs to complete — skipped staging jobs are fine
    needs: [build, plan-staging, apply-staging, sync-staging]
    if: |
      always() &&
      needs.plan-staging.result == 'success' &&
      needs.apply-staging.result != 'failure' &&
      needs.sync-staging.result != 'failure'
    environment:
      name: production
      deployment: false # access env vars/secrets without creating a deployment record

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: terraform/envs/production

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d #v4.0.1
        with:
          filters: |
            website:
              - 'website/public/**'

      - name: Set run flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "website=true" >> $GITHUB_OUTPUT
          else
            echo "website=${{ steps.changes.outputs.website }}" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb #v2.0.0

      - name: Tofu Init
        run: tofu init

      - name: Tofu Plan
        id: plan
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_lambda_s3_key: ${{ needs.build.outputs.lambda_s3_key }}
        run: |
          set +e
          tofu plan -detailed-exitcode -out=tfplan
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 1 ]; then exit 1; fi
          echo "has_changes=$([ $EXIT_CODE -eq 2 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Upload plan
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: tfplan-production
          path: terraform/envs/production/tfplan
          retention-days: 1

  apply-production:
    name: Apply (production)
    runs-on: ubuntu-latest
    needs: [build, plan-production]
    environment: production # approval gate — reviewer sees plan output above before approving

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: terraform/envs/production

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb #v2.0.0

      - name: Tofu Init
        run: tofu init

      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: tfplan-production
          path: terraform/envs/production/

      - name: Tofu Apply
        run: tofu apply -auto-approve tfplan

  sync-production:
    name: Sync website (production)
    runs-on: ubuntu-latest
    needs: [apply-production]
    if: needs.apply-production.result == 'success'

    permissions:
      id-token: write
      contents: read
      issues: write # required for ZAP to open scan report issues

    defaults:
      run:
        working-directory: terraform/envs/production

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d #v4.0.1
        with:
          filters: |
            website:
              - 'website/public/**'

      - name: Set sync flag
        id: flags
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "website=true" >> $GITHUB_OUTPUT
          else
            echo "website=${{ steps.changes.outputs.website }}" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.flags.outputs.website == 'true'
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup OpenTofu
        if: steps.flags.outputs.website == 'true'
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb #v2.0.0

      - name: Tofu Init
        if: steps.flags.outputs.website == 'true'
        run: tofu init

      - name: Sync website to S3
        if: steps.flags.outputs.website == 'true'
        run: |
          API_URL=$(tofu output -raw api_gateway_url | sed 's|/$||')
          sed -i "s|__API_URL__|$API_URL|g" ${{ github.workspace }}/website/public/counter.js
          BUCKET=$(tofu output -raw s3_bucket_name)
          aws s3 sync ${{ github.workspace }}/website/public/ s3://$BUCKET/ --delete \
            --exclude "*.html" --cache-control "max-age=31536000,immutable"
          aws s3 sync ${{ github.workspace }}/website/public/ s3://$BUCKET/ --delete \
            --exclude "*" --include "*.html" --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        if: steps.flags.outputs.website == 'true'
        run: |
          DIST_ID=$(tofu output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation \
            --distribution-id $DIST_ID \
            --invalidation-batch "{\"Paths\":{\"Quantity\":1,\"Items\":[\"/*\"]},\"CallerReference\":\"github-actions-${{ github.run_id }}\"}"

      - name: ZAP Baseline Scan
        if: steps.flags.outputs.website == 'true'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 #v0.15.0
        with:
          target: "https://fidele.samuth.com"
          fail_action: false
          issue_title: "ZAP Baseline Scan Report"
