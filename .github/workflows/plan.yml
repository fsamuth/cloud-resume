name: Plan infrastructure

on:
  pull_request:

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Run tests
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          cd website && ../.venv/bin/python -m pytest tests/ -v --junitxml=../pytest-report.xml

      - name: Test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 #v3.0.0
        if: always()
        with:
          name: pytest
          path: pytest-report.xml
          reporter: java-junit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-3

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb #v2.0.0

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 #v6.2.2

      - name: Run TFLint
        working-directory: terraform
        run: |
          tflint --init
          tflint

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@0ce65fae06c148e349f955c3c35ad049c11e838c #v12.3092.0
        with:
          directory: ./terraform/
          framework: terraform
          quiet: true
          soft_fail: true
          output_format: sarif
          output_file_path: checkov.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 #v4.35.1
        if: always()
        with:
          sarif_file: checkov.sarif

      - name: Tofu Init
        working-directory: terraform
        run: tofu init

      - name: Tofu Plan
        working-directory: terraform
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
        run: tofu plan -out=tfplan

      - name: Post plan comment
        uses: borchero/terraform-plan-comment@d177dfb833ccfb6ef6022700796190dfe54830f1 #v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          terraform-cmd: tofu
          working-directory: terraform
          planfile: tfplan