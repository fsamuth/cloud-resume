name: Deploy Resume

on:
  push:
    branches: [main]
    # Only run when infra, workflows or website files change
    paths:
      - 'terraform/**'
      - 'website/**'
      - '.github/workflows/**'
  workflow_dispatch: # allow manual trigger

# Cancel in-progress runs on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest

    permissions:
      id-token: write # required for OIDC authentication with AWS
      contents: read

    outputs:
      website: ${{ steps.flags.outputs.website }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      # Detect whether website files changed to conditionally sync S3 and invalidate cache
      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d #v4.0.1
        with:
          filters: |
            website:
              - 'website/public/**'

      # On workflow_dispatch, force all steps to run regardless of changed files
      - name: Set run flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "website=true" >> $GITHUB_OUTPUT
          else
            echo "website=${{ steps.changes.outputs.website }}" >> $GITHUB_OUTPUT
          fi

      # Authenticate via OIDC — no long-lived credentials stored in secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb #v2.0.0

      - name: Tofu Init
        working-directory: terraform
        run: tofu init

      - name: Tofu Plan
        working-directory: terraform
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
        run: tofu plan -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    environment: production # requires manual approval

    permissions:
      id-token: write # required for OIDC authentication with AWS
      contents: read
      issues: write   # required for ZAP to open scan report issues

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      # Authenticate via OIDC — no long-lived credentials stored in secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb #v2.0.0

      - name: Tofu Init
        working-directory: terraform
        run: tofu init

      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: tfplan
          path: terraform/

      - name: Tofu Apply
        working-directory: terraform
        run: tofu apply -auto-approve tfplan

      # Only sync if website files changed
      - name: Sync website to S3
        if: needs.plan.outputs.website == 'true'
        run: |
          API_URL=$(cd terraform && tofu output -raw api_gateway_url | sed 's|/$||')
          sed -i "s|__API_URL__|$API_URL|g" website/public/counter.js
          BUCKET=$(cd terraform && tofu output -raw s3_bucket_name)
          aws s3 sync website/public/ s3://$BUCKET/ --delete

      # Only invalidate if website files changed
      - name: Invalidate CloudFront cache
        if: needs.plan.outputs.website == 'true'
        run: |
          DIST_ID=$(cd terraform && tofu output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation \
            --distribution-id $DIST_ID \
            --invalidation-batch "{\"Paths\":{\"Quantity\":1,\"Items\":[\"/*\"]},\"CallerReference\":\"github-actions-${{ github.run_id }}\"}"

      # Passive security scan — only runs when website content changed
      - name: ZAP Baseline Scan
        if: needs.plan.outputs.website == 'true'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 #v0.15.0
        with:
          target: "https://${{ vars.DOMAIN_NAME }}"
          fail_action: false
          issue_title: "ZAP Baseline Scan Report"
