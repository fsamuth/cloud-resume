name: Deploy Resume

on:
  push:
    branches: [main]
    # Only run when infra, workflows or website files change
    paths:
      - 'terraform/**'
      - 'website/**'
      - '.github/workflows/**'
  workflow_dispatch: # allow manual trigger

permissions:
  id-token: write
  contents: read
  issues: write # required for ZAP to open scan report issues

# Cancel in-progress runs on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      id-token: write # required for OIDC authentication with AWS
      contents: read

    outputs:
      lambda_s3_key: ${{ steps.build.outputs.s3_key }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and upload Lambda package
        id: build
        run: |
          cd website
          zip /tmp/counter.zip counter.py
          HASH=$(sha256sum counter.py | cut -d' ' -f1)
          echo "s3_key=lambda/$HASH/counter.zip" >> $GITHUB_OUTPUT
          aws s3 ls s3://fsamuth-resume-artifacts/lambda/$HASH/counter.zip || \
            aws s3 cp /tmp/counter.zip s3://fsamuth-resume-artifacts/lambda/$HASH/counter.zip

  # ── Staging ────────────────────────────────────────────────────────────────

  staging:
    name: Staging
    needs: build
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: staging
      lambda_s3_key: ${{ needs.build.outputs.lambda_s3_key }}
      domain_name: "https://staging.fidele.samuth.com"

    secrets: inherit

  # ── Production ─────────────────────────────────────────────────────────────

  production:
    name: Production
    needs: [build, staging]
    if: always() && needs.staging.result == 'success'
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: production
      lambda_s3_key: ${{ needs.build.outputs.lambda_s3_key }}
      domain_name: "https://fidele.samuth.com"

    secrets: inherit
